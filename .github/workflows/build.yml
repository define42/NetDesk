name: Build NetDesk

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netdesk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck qemu-system-x86 ovmf

      - name: Check shell scripts
        run: make check

      - name: Test DHCP CA installation
        run: make test-ca

      - name: Build EFI image
        run: make build

      - name: Verify EFI contents
        run: make verify

      - name: Boot EFI image in QEMU
        run: make smoke

      - name: Upload EFI image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/netdesk.efi
          archive: false
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
