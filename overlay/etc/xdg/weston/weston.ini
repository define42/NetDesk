[core]
backend=drm
shell=desktop-shell.so
xwayland=true
idle-time=0
# Still show the desktop when an input device is connected after boot.
require-input=false

[shell]
background-color=0xff18232d
panel-color=0xee101820
panel-position=top
locking=false
animation=fade
clock-format=minutes-24h

[keyboard]
keymap_layout=us

[terminal]
font=DejaVu Sans Mono
font-size=13

[launcher]
icon=/usr/share/icons/hicolor/24x24/apps/chromium.png
path=/usr/local/bin/netdesk-browser

[launcher]
icon=/usr/share/weston/icon_window.png
path=/usr/local/bin/netdesk-remote-desktop

[launcher]
icon=/usr/share/weston/icon_terminal.png
path=/usr/bin/weston-terminal
