# Discover wired interfaces without depending on a firmware-specific device name.
allowinterfaces eth* en*
clientid
option domain_name_servers, domain_name, domain_search
option classless_static_routes
option interface_mtu
option host_name
# Option 42 supplies the time servers used by BusyBox ntpd.
option ntp_servers
env NTP_CONF=/etc/ntp.conf
# The standard ntp.conf hook only restarts an already-running daemon by default.
env ntp_restart_cmd=/usr/local/sbin/netdesk-update-ntp
# Option 43 contains the complete CA URL as plain text, not vendor suboptions.
define 43 string netdesk_ca_url
option netdesk_ca_url
# Adopt the DHCP hostname, falling back to netdesk when none is supplied.
env force_hostname=YES
env hostname_default=netdesk
require dhcp_server_identifier
slaac private
nohook wpa_supplicant
